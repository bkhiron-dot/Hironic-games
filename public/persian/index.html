<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Lanterns of Isfahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: the 3D city fills the screen; a manuscript-style panel rises from the bottom
   for story and puzzles; lantern progress sits at the top. One committed dusk look. */
:root {
  --night: #16122b;
  --lapis: #1f4f8f;
  --lapis-deep: #143766;
  --turq: #2b9c98;
  --saffron: #e2a51c;
  --saffron-deep: #a8740a;
  --parch: #fbf4e4;
  --parch-2: #efe2c4;
  --ink: #2a1d2e;
  --ink-soft: #5d4b57;
  --rose: #a33d2c;
  --leaf: #2f6b33;
  --on-dark: #fbeecb;
  --display: 'Marcellus', 'Palatino Linotype', Palatino, Georgia, serif;
  --body: 'Alegreya Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --fs: 20px;
  color-scheme: light;
}
html.big { --fs: 24px; }
html { font-size: var(--fs); }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--night); color: var(--ink); font-family: var(--body); line-height: 1.45; -webkit-text-size-adjust: 100%; }
body.no3d { background: linear-gradient(#1b1840, #7a4c78 45%, #e58a52 60%, #6a4a5a); }
button { font-family: inherit; touch-action: manipulation; cursor: pointer; }
[hidden] { display: none !important; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* Top bar: five lantern pips and two settings buttons */
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: space-between; align-items: center; gap: 10px; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.pips { display: flex; gap: 9px; background: rgba(22, 18, 43, .68); padding: 10px 14px; border-radius: 999px; }
.pip { width: 15px; height: 22px; border-radius: 7px 7px 4px 4px; background: #3a3046; border: 2px solid #8a7a5a; transition: all .6s; }
.pip.lit { background: radial-gradient(circle at 50% 55%, #fff3c4, #ffb02e 60%, #c46a10); border-color: #f6d27a; box-shadow: 0 0 12px 3px rgba(255, 176, 46, .7); }
.hud-btns { display: flex; gap: 8px; }
.chip {
  min-height: 48px; min-width: 48px; padding: 0 14px; border-radius: 999px;
  border: 2px solid rgba(246, 210, 122, .75); background: rgba(22, 18, 43, .72); color: var(--on-dark);
  font: 700 .8rem var(--body);
}

/* Place name shown on arrival */
.place {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 78px); width: min(92%, 560px);
  text-align: center; color: #fff7e0; text-shadow: 0 2px 10px rgba(0, 0, 0, .9), 0 0 2px #000;
  font-family: var(--display); font-size: 1.6rem; line-height: 1.2; pointer-events: none; transition: opacity 1s;
}
.place small { display: block; margin-top: 6px; font-family: var(--body); font-size: .9rem; font-weight: 500; }
.place.fade { opacity: 0; }

/* Bottom action buttons */
.actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.btn {
  min-height: 60px; width: min(100%, 460px); padding: 10px 18px; border: 0; border-radius: 16px;
  background: var(--lapis); color: #fff; font: 700 1.05rem var(--body); line-height: 1.2;
  box-shadow: 0 4px 0 var(--lapis-deep), 0 8px 22px rgba(0, 0, 0, .35);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--lapis-deep); }
.btn.gold { background: var(--saffron); color: #2a1a05; box-shadow: 0 4px 0 var(--saffron-deep), 0 8px 22px rgba(0, 0, 0, .3); }
.btn.gold:active { box-shadow: 0 1px 0 var(--saffron-deep); }
.btn.ghost { background: var(--parch); color: var(--lapis-deep); border: 2px solid var(--lapis); box-shadow: none; }
.btn:focus-visible, .chip:focus-visible, .tile:focus-visible, .slot:focus-visible, .cell:focus-visible, .choice:focus-visible, .mcell:focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; }

/* The parchment panel */
.panel {
  position: fixed; left: 0; right: 0; margin: 0 auto; z-index: 10; box-sizing: border-box;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: min(calc(100% - 28px), 620px);
  max-height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 84px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--parch); border: 3px solid var(--saffron); border-radius: 22px;
  box-shadow: 0 0 0 5px var(--lapis), 0 6px 18px rgba(0, 0, 0, .45);
  padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px;
}
.panel h2 { margin: 0; font: 400 1.5rem/1.15 var(--display); color: var(--lapis-deep); text-wrap: balance; }
.eyebrow { margin: 0 0 -8px; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.say { margin: 0; font-size: 1.05rem; white-space: pre-line; }
.riddle {
  margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--parch-2);
  font: 400 1.15rem/1.5 var(--display); color: var(--ink); white-space: pre-line; text-align: center;
}
.feedback { margin: 0; min-height: 1.4em; font-weight: 700; color: var(--rose); }
.feedback.good { color: var(--leaf); }
.feedback:empty { display: none; }
.hint-box { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: #e3ecf6; }
.hint-box p { margin: 0; }
.hint-box p::before { content: "Hint: "; font-weight: 700; color: var(--lapis-deep); }
.hint-box img { width: 140px; height: 140px; border-radius: 8px; display: block; margin-top: 6px; }
/* Hint and Step back stay in view at the bottom of the panel, even when it scrolls */
.foot { display: flex; flex-wrap: wrap; gap: 10px; position: sticky; bottom: -18px; margin: 0 -20px -18px; padding: 10px 20px 18px; background: var(--parch); border-top: 1px solid var(--parch-2); }
.foot .btn { flex: 1 1 180px; width: auto; }
.story p { margin: 0; font-size: 1.05rem; }
.story { display: flex; flex-direction: column; gap: 10px; }
.tips { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }

/* Puzzle: multiple choice */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice {
  min-height: 60px; border-radius: 14px; border: 2px solid var(--lapis); background: #fff;
  color: var(--lapis-deep); font: 700 1.05rem var(--body); padding: 8px;
}
.choice.wrong { border-color: #b9a9a0; color: #9a8a85; background: #f1ebe4; text-decoration: line-through; }
.choice.right { background: var(--leaf); border-color: var(--leaf); color: #fff; }
.choice.gone { visibility: hidden; }

/* Puzzle: spelling with letter tiles */
.slots, .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.slot {
  width: 2.3rem; height: 2.8rem; border: 0; border-bottom: 4px solid var(--lapis); border-radius: 8px 8px 2px 2px;
  background: #fff; font: 700 1.5rem var(--body); color: var(--ink); padding: 0;
}
.slot.locked { background: #e3ecf6; color: var(--lapis-deep); }
.slot.right { background: #dcefd9; border-color: var(--leaf); }
.tile {
  width: 2.8rem; height: 2.8rem; border-radius: 12px; border: 2px solid var(--saffron-deep);
  background: linear-gradient(#fbe7b0, #f1cf73); font: 700 1.5rem var(--body); color: #3a2605; padding: 0;
  box-shadow: 0 3px 0 var(--saffron-deep);
}
.tile.used { visibility: hidden; }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Puzzle: mosaic */
.mosaic { width: min(100%, 320px, 36vh); aspect-ratio: 1; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: var(--saffron-deep); padding: 3px; border-radius: 10px; box-sizing: border-box; }
.mcell { padding: 0; border: 0; background: #173d70; overflow: hidden; }
.mcell canvas { width: 100%; height: 100%; display: block; transition: transform .3s ease; }
.mcell.fixed { cursor: default; }
.mosaic.done { box-shadow: 0 0 0 4px var(--leaf); }

/* Puzzle: word search */
.wgrid { width: min(100%, 340px, 40vh); margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.cell {
  aspect-ratio: 1; border-radius: 10px; border: 2px solid #d8c69d; background: #fff;
  font: 700 1.3rem var(--body); color: var(--ink); padding: 0;
}
.cell.sel { background: var(--saffron); border-color: var(--saffron-deep); }
.cell.pulse { animation: pulse 1s infinite; }
@keyframes pulse { 50% { background: #ffe9a6; border-color: var(--saffron-deep); } }
.cell.f0 { background: #bfe5e2; border-color: var(--turq); }
.cell.f1 { background: #f6dc9a; border-color: var(--saffron-deep); }
.cell.f2 { background: #f2c4b8; border-color: var(--rose); }
.cell.f3 { background: #c9d8f0; border-color: var(--lapis); }
.words { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin: 0; padding: 0; list-style: none; font-weight: 700; font-size: 1.1rem; }
.words li.found { text-decoration: line-through; color: var(--leaf); }

/* Title screen */
.cover {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 14px;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(20px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(22, 18, 43, 0) 25%, rgba(22, 18, 43, .9) 75%);
  text-align: center; color: var(--on-dark);
}
.cover h1 { margin: 0; font: 400 2.6rem/1.05 var(--display); color: #f6cf6a; text-shadow: 0 3px 14px rgba(0, 0, 0, .7); text-wrap: balance; }
.cover p { margin: 0 0 8px; font-size: 1.05rem; max-width: 30em; }
.cover .btn { max-width: 420px; }
.cover .note { font-size: .8rem; opacity: .85; margin-top: 4px; }

@media (prefers-reduced-motion: reduce) {
  .mcell canvas, .place, .pip { transition: none; }
  .shake, .cell.pulse { animation: none; }
}
</style>

<canvas id="scene" aria-label="A medieval Persian city at dusk"></canvas>

<div class="hud">
  <div class="pips" id="pips" aria-label="Lanterns lit"></div>
  <div class="hud-btns">
    <button class="chip" id="soundBtn" aria-pressed="true">Sound on</button>
    <button class="chip" id="textBtn" aria-label="Change text size">A+</button>
  </div>
</div>
<div class="place fade" id="place" aria-live="polite"></div>
<div class="actions" id="actions" hidden></div>
<div class="panel" id="panel" role="dialog" aria-modal="false" hidden></div>

<div class="cover" id="cover">
  <h1>The Lanterns of Isfahan</h1>
  <p>Isfahan, in the year 1150. Night is falling and the city’s lanterns are dark. Solve five puzzles to light them again.</p>
  <div id="coverBtns" style="display:flex;flex-direction:column;gap:12px;width:100%;align-items:center"></div>
  <p class="note">Best held upright. Your progress is saved on this phone.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

/* =========================================================================
   Small helpers
   ========================================================================= */
const $ = (s) => document.querySelector(s);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function button(label, cls, onClick) {
  const b = el('button', cls, label);
  b.type = 'button';
  b.addEventListener('click', onClick);
  return b;
}
// A seeded random sequence, so the city is the same every time it loads.
function seeded(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(list, rand) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const ease = (u) => u * u * (3 - 2 * u);

/* =========================================================================
   Saved progress (kept on this phone only)
   ========================================================================= */
const SAVE_KEY = 'lanterns-of-isfahan';
const game = { at: 0, solved: [false, false, false, false, false], finished: false, big: false, sound: true, mode: 'title' };

function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && Array.isArray(s.solved) && s.solved.length === 5) return s;
  } catch (e) { /* no saved game */ }
  return null;
}
function writeSave() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      at: game.at, solved: game.solved, finished: game.finished, big: game.big, sound: game.sound,
    }));
  } catch (e) { /* storage blocked: the game still plays */ }
}

/* =========================================================================
   Sound: a soft chime when a lantern lights (only after a tap, as phones require)
   ========================================================================= */
let audio = null;
function chime(big) {
  if (!game.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const notes = big ? [523.25, 659.25, 783.99, 1046.5, 1318.5] : [659.25, 880, 987.77];
    notes.forEach((f, i) => {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      const t = audio.currentTime + i * 0.17;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
      o.connect(g).connect(audio.destination);
      o.start(t);
      o.stop(t + 1.9);
    });
  } catch (e) { /* no audio available */ }
}

/* =========================================================================
   The mosaic pattern (used by the tile puzzle and the workshop wall)
   ========================================================================= */
const MOSAIC_SIZE = 480;
const MOSAIC_START = [1, 3, 2, 3, 0, 1, 2, 1, 3]; // quarter turns of each tile when scrambled

function drawMosaic(g, S) {
  const c = S / 2;
  g.fillStyle = '#173d70';
  g.fillRect(0, 0, S, S);
  // Fine lattice in the background
  g.strokeStyle = 'rgba(120, 190, 200, .35)';
  g.lineWidth = S * 0.006;
  for (let i = -S; i < 2 * S; i += S / 9) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i + S, S); g.stroke();
    g.beginPath(); g.moveTo(i, S); g.lineTo(i + S, 0); g.stroke();
  }
  const disc = (x, y, r, fill, stroke) => {
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    g.fillStyle = fill; g.fill();
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = S * 0.01; g.stroke(); }
  };
  // Rosettes in the corners: these tell you which way each corner tile goes
  for (const [x, y] of [[0, 0], [S, 0], [0, S], [S, S]]) {
    disc(x, y, S * 0.2, '#e2a51c');
    disc(x, y, S * 0.13, '#a33d2c');
    disc(x, y, S * 0.05, '#fbf4e4');
  }
  // Half-moons at the middle of each edge
  for (const [x, y] of [[c, 0], [S, c], [c, S], [0, c]]) disc(x, y, S * 0.09, '#2b9c98', '#f1c24a');
  // The gold ring
  g.beginPath(); g.arc(c, c, S * 0.36, 0, Math.PI * 2);
  g.strokeStyle = '#f1c24a'; g.lineWidth = S * 0.03; g.stroke();
  // Eight-pointed star
  g.beginPath();
  for (let k = 0; k < 16; k++) {
    const r = k % 2 === 0 ? S * 0.31 : S * 0.17;
    const a = k * Math.PI / 8 - Math.PI / 2;
    const x = c + r * Math.cos(a), y = c + r * Math.sin(a);
    if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
  g.fillStyle = '#2b9c98'; g.fill();
  g.strokeStyle = '#f1c24a'; g.lineWidth = S * 0.012; g.stroke();
  disc(c, c, S * 0.08, '#fbf4e4');
  disc(c, c, S * 0.04, '#a33d2c');
}

const mosaicCanvas = document.createElement('canvas');
mosaicCanvas.width = mosaicCanvas.height = MOSAIC_SIZE;
drawMosaic(mosaicCanvas.getContext('2d'), MOSAIC_SIZE);

// Draws the mosaic with each tile turned by the given quarter turns.
function drawTurnedMosaic(g, S, turns) {
  const T = S / 3, src = MOSAIC_SIZE / 3;
  for (let i = 0; i < 9; i++) {
    const col = i % 3, row = Math.floor(i / 3);
    g.save();
    g.translate(col * T + T / 2, row * T + T / 2);
    g.rotate(turns[i] * Math.PI / 2);
    g.drawImage(mosaicCanvas, col * src, row * src, src, src, -T / 2, -T / 2, T, T);
    g.restore();
  }
}

/* =========================================================================
   Puzzle 1 and 4 style: a riddle with four answers to choose from
   ========================================================================= */
function choicePuzzle(cfg) {
  return function create(ctx) {
    const root = el('div', 'pz');
    root.append(el('p', 'riddle', cfg.riddle));
    const grid = el('div', 'choices');
    root.append(grid);
    const inst = { root, done: false };
    const buttons = cfg.choices.map((c) => {
      const b = button(c, 'choice', () => pick(b, c));
      grid.append(b);
      return b;
    });
    function pick(b, c) {
      if (inst.done || b.disabled) return;
      if (c === cfg.answer) {
        b.classList.add('right');
        ctx.solved();
      } else {
        b.classList.add('wrong');
        b.disabled = true;
        ctx.say(cfg.wrong);
      }
    }
    inst.hints = [
      { text: cfg.hints[0] },
      { text: cfg.hints[1] },
      {
        text: cfg.hints[2],
        act: () => {
          // Take away two wrong answers (the ones not already tried first)
          const wrong = buttons.filter((b, i) => cfg.choices[i] !== cfg.answer);
          wrong.sort((a, b) => (a.disabled ? 1 : 0) - (b.disabled ? 1 : 0));
          wrong.slice(0, 2).forEach((b) => { b.classList.add('gone'); b.disabled = true; });
        },
      },
    ];
    inst.solve = () => pick(buttons[cfg.choices.indexOf(cfg.answer)], cfg.answer);
    return inst;
  };
}

/* =========================================================================
   Puzzles 2 and 4: spell a word by tapping letter tiles
   ========================================================================= */
function spellPuzzle(cfg) {
  return function create(ctx) {
    const answer = cfg.answer;
    const n = answer.length;
    const rand = seeded(answer.length * 97 + 13);
    let letters;
    do { letters = shuffle((answer + (cfg.extra || '')).split(''), rand); }
    while (letters.slice(0, n).join('') === answer);

    const root = el('div', 'pz');
    if (cfg.riddle) root.append(el('p', 'riddle', cfg.riddle));
    const slotRow = el('div', 'slots');
    const tileRow = el('div', 'tiles');
    root.append(slotRow, tileRow);
    const inst = { root, done: false };

    const tiles = letters.map((ch) => {
      const t = { ch, used: false };
      t.btn = button(ch, 'tile', () => place(t));
      t.btn.setAttribute('aria-label', 'Letter ' + ch);
      tileRow.append(t.btn);
      return t;
    });
    const slots = Array.from({ length: n }, (_, i) => {
      const s = { tile: null, locked: false };
      s.btn = button('', 'slot', () => takeBack(s));
      s.btn.setAttribute('aria-label', 'Letter space ' + (i + 1));
      slotRow.append(s.btn);
      return s;
    });

    function render() {
      tiles.forEach((t) => t.btn.classList.toggle('used', t.used));
      slots.forEach((s) => {
        s.btn.textContent = s.tile ? s.tile.ch : '';
        s.btn.classList.toggle('locked', s.locked);
      });
    }
    function place(t) {
      if (inst.done || t.used) return;
      const s = slots.find((x) => !x.tile && !x.locked);
      if (!s) return;
      s.tile = t; t.used = true;
      ctx.say('');
      render();
      if (slots.every((x) => x.tile)) check();
    }
    function takeBack(s) {
      if (inst.done || s.locked || !s.tile) return;
      s.tile.used = false; s.tile = null;
      ctx.say('');
      render();
    }
    function check() {
      const word = slots.map((s) => s.tile.ch).join('');
      if (word === answer) {
        inst.done = true;
        slots.forEach((s) => s.btn.classList.add('right'));
        ctx.solved();
      } else {
        ctx.say('Not quite. Tap a letter in the top row to send it back.');
        slotRow.classList.remove('shake'); void slotRow.offsetWidth; slotRow.classList.add('shake');
      }
    }
    // Put the first k letters of the answer in place and lock them.
    function reveal(k) {
      slots.forEach((s) => { if (!s.locked && s.tile) { s.tile.used = false; s.tile = null; } });
      for (let i = 0; i < k; i++) {
        const s = slots[i];
        if (s.locked) continue;
        const t = tiles.find((x) => !x.used && x.ch === answer[i]);
        s.tile = t; t.used = true; s.locked = true;
      }
      render();
    }
    inst.hints = [
      { text: cfg.hints[0] },
      { text: cfg.hints[1], act: () => reveal(1) },
      { text: cfg.hints[2], act: () => reveal(n - 2) },
    ];
    inst.solve = () => { reveal(n); check(); };
    render();
    return inst;
  };
}

/* =========================================================================
   Puzzle 3: turn the mosaic tiles until the pattern is whole
   ========================================================================= */
function mosaicPuzzle() {
  return function create(ctx) {
    const root = el('div', 'pz');
    const grid = el('div', 'mosaic');
    root.append(grid);
    const inst = { root, done: false };
    const src = MOSAIC_SIZE / 3;
    const cells = MOSAIC_START.map((start, i) => {
      const cell = { turns: start, fixed: i === 4 };
      cell.btn = button('', 'mcell' + (cell.fixed ? ' fixed' : ''), () => turn(cell));
      cell.btn.setAttribute('aria-label', cell.fixed ? 'Middle tile, already in place' : 'Tile ' + (i + 1) + ', tap to turn');
      const cv = document.createElement('canvas');
      cv.width = cv.height = src;
      cv.getContext('2d').drawImage(mosaicCanvas, (i % 3) * src, Math.floor(i / 3) * src, src, src, 0, 0, src, src);
      cell.btn.append(cv);
      cell.canvas = cv;
      grid.append(cell.btn);
      return cell;
    });
    const show = (c) => { c.canvas.style.transform = 'rotate(' + (c.turns * 90) + 'deg)'; };
    cells.forEach(show);

    function turn(c) {
      if (inst.done || c.fixed) return;
      c.turns += 1;
      show(c);
      check();
    }
    function check() {
      if (cells.every((c) => c.turns % 4 === 0)) {
        inst.done = true;
        setTimeout(() => grid.classList.add('done'), 300);
        ctx.solved();
      }
    }
    // Turn a tile the shortest way forward until it's right.
    const fix = (c) => { c.turns += (4 - (c.turns % 4)) % 4; show(c); };
    const thumb = new Image();
    thumb.alt = 'The finished mosaic';
    thumb.src = mosaicCanvas.toDataURL();
    inst.hints = [
      { text: 'Look at the gold ring. It should make one complete circle around the star.' },
      { text: 'Here is how the finished mosaic looks. The orange flowers sit in the four corners.', image: thumb },
      {
        text: 'I have turned most of the tiles for you. Only two are left.',
        act: () => { cells.filter((c) => c.turns % 4 !== 0).slice(2).forEach(fix); },
      },
    ];
    inst.solve = () => { cells.forEach(fix); setTimeout(check, 350); };
    return inst;
  };
}

/* =========================================================================
   Puzzle 5: find four garden words in a grid of letters
   ========================================================================= */
function wordSearchPuzzle() {
  const GRID = ['ROSEKA', 'BMINTL', 'FAPDQZ', 'IHOKEN', 'GUOWAY', 'TELJAR'];
  // Each word's first and last letter as [row, column]
  const WORDS = [
    { word: 'ROSE', a: [0, 0], b: [0, 3] },
    { word: 'FIG', a: [2, 0], b: [4, 0] },
    { word: 'MINT', a: [1, 1], b: [1, 4] },
    { word: 'POOL', a: [2, 2], b: [5, 2] },
  ];
  return function create(ctx) {
    const root = el('div', 'pz');
    const list = el('ul', 'words');
    const grid = el('div', 'wgrid');
    root.append(list, grid);
    const inst = { root, done: false };
    WORDS.forEach((w) => { w.found = false; w.li = el('li', null, w.word); list.append(w.li); });

    const cells = GRID.map((row, r) => row.split('').map((ch, c) => {
      const b = button(ch, 'cell', () => tap(r, c));
      b.setAttribute('aria-label', 'Letter ' + ch + ', row ' + (r + 1) + ', column ' + (c + 1));
      grid.append(b);
      return b;
    }));
    let sel = null;
    const same = (p, q) => p[0] === q[0] && p[1] === q[1];

    function cellsBetween(a, b) {
      const dr = Math.sign(b[0] - a[0]), dc = Math.sign(b[1] - a[1]);
      const len = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])) + 1;
      return Array.from({ length: len }, (_, i) => cells[a[0] + dr * i][a[1] + dc * i]);
    }
    function markFound(w) {
      w.found = true;
      w.li.classList.add('found');
      const k = WORDS.indexOf(w);
      cellsBetween(w.a, w.b).forEach((b) => b.classList.add('f' + k));
      cells.flat().forEach((b) => b.classList.remove('pulse'));
      if (WORDS.every((x) => x.found)) {
        inst.done = true;
        ctx.solved();
      } else {
        ctx.say('You found ' + w.word + '!', 'good');
      }
    }
    function tap(r, c) {
      if (inst.done) return;
      const p = [r, c];
      if (!sel) {
        sel = p;
        cells[r][c].classList.add('sel');
        ctx.say('Now tap the last letter of the word.', 'good');
        return;
      }
      cells[sel[0]][sel[1]].classList.remove('sel');
      if (same(sel, p)) { sel = null; ctx.say(''); return; }
      const w = WORDS.find((x) => !x.found && ((same(x.a, sel) && same(x.b, p)) || (same(x.b, sel) && same(x.a, p))));
      sel = null;
      if (w) markFound(w);
      else ctx.say('Those letters don’t make one of the words. Try again.');
    }
    const firstMissing = () => WORDS.find((w) => !w.found);
    inst.hints = [
      { text: 'The words read across from left to right, or straight down.' },
      {
        text: 'Look for the glowing letter: a word starts there.',
        act: () => { const w = firstMissing(); if (w) cells[w.a[0]][w.a[1]].classList.add('pulse'); },
      },
      {
        text: 'I have found one word for you.',
        act: () => { const w = firstMissing(); if (w) markFound(w); },
      },
    ];
    inst.solve = () => { WORDS.filter((w) => !w.found).forEach(markFound); };
    return inst;
  };
}

// Paint a texture on a canvas, then keep it as an image: phones can wipe hidden
// canvases when the app is switched away, which would turn the texture black.
function paintTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const img = new Image();
  const t = new THREE.Texture(img);
  img.onload = () => { t.needsUpdate = true; };
  img.src = c.toDataURL();
  if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); }
  return t;
}

  function palm(x, z, h) {

/* =========================================================================
   Camera: stand at a place, glide between places, drag to look around
   ========================================================================= */
const view = { x: 0, y: 1.6, z: 9.5, yaw: 0, pitch: 0 };
const look = { yaw: 0, pitch: 0, lastDrag: 0 };
let glide = null;

function poseOf(st) {
  const dx = st.look[0] - st.cam[0], dy = st.look[1] - st.cam[1], dz = st.look[2] - st.cam[2];
  return { x: st.cam[0], y: st.cam[1], z: st.cam[2], yaw: Math.atan2(-dx, -dz), pitch: Math.atan2(dy, Math.hypot(dx, dz)) };
}
function setPose(p) { Object.assign(view, { x: p.x, y: p.y, z: p.z, yaw: p.yaw, pitch: p.pitch }); look.yaw = 0; look.pitch = 0; }
function angleLerp(a, b, u) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * u;
}
// Walk smoothly to a new pose: turn to face the way, walk, then turn to face the person.
function glideTo(to, done) {
  if (!has3D) { setPose(to); done(); return; }
  const from = { x: view.x, y: view.y, z: view.z, yaw: view.yaw + look.yaw, pitch: view.pitch + look.pitch };
  look.yaw = 0; look.pitch = 0;
  const dist = Math.hypot(to.x - from.x, to.z - from.z);
  glide = {
    from, to, done, t: 0,
    dur: clamp(dist / 5.5, 2.5, 6.5),
    walkYaw: dist > 3 ? Math.atan2(-(to.x - from.x), -(to.z - from.z)) : null,
  };
}
function updateGlide(dt) {
  const g = glide;
  g.t += dt;
  const u = clamp(g.t / g.dur, 0, 1);
  const e = ease(u);
  view.x = g.from.x + (g.to.x - g.from.x) * e;
  view.z = g.from.z + (g.to.z - g.from.z) * e;
  view.y = g.from.y + (g.to.y - g.from.y) * e + Math.sin(g.t * 9) * 0.03 * Math.sin(Math.PI * u);
  if (g.walkYaw === null) {
    view.yaw = angleLerp(g.from.yaw, g.to.yaw, e);
    view.pitch = g.from.pitch + (g.to.pitch - g.from.pitch) * e;
  } else if (u < 0.2) {
    const k = ease(u / 0.2);
    view.yaw = angleLerp(g.from.yaw, g.walkYaw, k);
    view.pitch = g.from.pitch * (1 - k);
  } else if (u < 0.75) {
    view.yaw = g.walkYaw; view.pitch = 0;
  } else {
    const k = ease((u - 0.75) / 0.25);
    view.yaw = angleLerp(g.walkYaw, g.to.yaw, k);
    view.pitch = g.to.pitch * k;
  }
  if (u >= 1) { glide = null; g.done(); }
}

// Dragging looks around; a short tap on a person talks to them.
const pointer = { down: false, x: 0, y: 0, moved: false };
canvas.addEventListener('pointerdown', (e) => {
  pointer.down = true; pointer.x = e.clientX; pointer.y = e.clientY; pointer.moved = false;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointer.down) return;
  const dx = e.clientX - pointer.x, dy = e.clientY - pointer.y;
  if (!pointer.moved && Math.hypot(dx, dy) < 8) return;
  pointer.moved = true;
  pointer.x = e.clientX; pointer.y = e.clientY;
  if (glide || (game.mode !== 'explore' && game.mode !== 'ended')) return;
  look.yaw = clamp(look.yaw + dx * 0.005, -1.4, 1.4);
  look.pitch = clamp(look.pitch + dy * 0.004, -0.5, 0.6);
  look.lastDrag = performance.now();
});
canvas.addEventListener('pointerup', (e) => {
  if (pointer.down && !pointer.moved) tapScene(e.clientX, e.clientY);
  pointer.down = false;
});
canvas.addEventListener('pointercancel', () => { pointer.down = false; });

function tapScene(cx, cy) {
  if (!has3D || glide || game.mode !== 'explore') return;
  const ray = new THREE.Raycaster();
  ray.setFromCamera({ x: (cx / innerWidth) * 2 - 1, y: -(cy / innerHeight) * 2 + 1 }, camera);
  const hit = ray.intersectObjects(world.people, true)[0];
  if (!hit) return;
  let o = hit.object;
  while (o && o.userData.station === undefined) o = o.parent;
  if (o && o.userData.station === game.at && !game.solved[game.at]) openPuzzle(game.at);
}

/* =========================================================================
   Screen furniture: lantern pips, place names, buttons, the panel
   ========================================================================= */
const pipsEl = $('#pips'), placeEl = $('#place'), actionsEl = $('#actions'), panelEl = $('#panel');
for (let i = 0; i < 5; i++) pipsEl.append(el('span', 'pip'));

function updatePips() {
  [...pipsEl.children].forEach((p, i) => p.classList.toggle('lit', game.solved[i]));
  pipsEl.setAttribute('aria-label', game.solved.filter(Boolean).length + ' of 5 lanterns lit');
}
let placeTimer = 0;
function showPlace(title, sub) {
  placeEl.replaceChildren(document.createTextNode(title));
  if (sub) placeEl.append(el('small', null, sub));
  placeEl.classList.remove('fade');
  clearTimeout(placeTimer);
  placeTimer = setTimeout(() => placeEl.classList.add('fade'), 5000);
}
function hidePlace() { clearTimeout(placeTimer); placeEl.classList.add('fade'); }

function openPanel(nodes) {
  panelEl.replaceChildren(...nodes);
  panelEl.hidden = false;
  panelEl.scrollTop = 0;
  actionsEl.hidden = true;
  hidePlace();
}
function closePanel() { panelEl.hidden = true; }

function refreshActions() {
  actionsEl.replaceChildren();
  updatePips();
  const i = game.at;
  const talkable = game.mode === 'explore' && !game.solved[i];
  if (world.marker) world.marker.visible = talkable;
  if (game.mode !== 'explore' && game.mode !== 'ended') { actionsEl.hidden = true; return; }
  actionsEl.hidden = false;
  if (game.mode === 'ended') {
    actionsEl.append(button('Play again', 'btn ghost', () => { resetGame(); startPlaying(); }));
  } else if (!game.solved[i]) {
    actionsEl.append(button('Talk to ' + STATIONS[i].person.name, 'btn', () => openPuzzle(i)));
  } else if (i < STATIONS.length - 1) {
    actionsEl.append(button('Walk to ' + STATIONS[i + 1].name, 'btn', () => walkTo(i + 1)));
  } else {
    actionsEl.append(button('Light the great lantern', 'btn gold', finale));
  }
}

/* =========================================================================
   Puzzles in the panel
   ========================================================================= */
let puzzles = [];

function openPuzzle(i) {
  game.mode = 'puzzle';
  refreshActions();
  if (!puzzles[i]) puzzles[i] = makePuzzleView(i);
  openPanel([puzzles[i].view]);
}

function makePuzzleView(i) {
  const st = STATIONS[i];
  const feedback = el('p', 'feedback');
  feedback.setAttribute('aria-live', 'polite');
  const say = (text, tone) => { feedback.textContent = text || ''; feedback.className = 'feedback ' + (tone || ''); };
  const inst = st.create({ say, solved: () => onSolved(i) });
  inst.hintsUsed = 0;
  const view = el('div', 'pview');
  view.style.cssText = 'display:flex;flex-direction:column;gap:14px';
  const hintBox = el('div', 'hint-box');
  hintBox.hidden = true;
  const foot = el('div', 'foot');
  const hintBtn = button('Give me a hint', 'btn gold', () => {
    if (inst.done) return;
    if (inst.hintsUsed < inst.hints.length) {
      const h = inst.hints[inst.hintsUsed++];
      const p = el('p', null, h.text);
      hintBox.append(p);
      if (h.image) hintBox.append(h.image);
      hintBox.hidden = false;
      if (h.act) h.act();
      hintBtn.textContent = inst.hintsUsed < inst.hints.length ? 'Another hint' : 'Solve it for me';
      p.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else {
      inst.solve();
    }
  });
  const back = button('Step back', 'btn ghost', () => { closePanel(); game.mode = 'explore'; refreshActions(); });
  foot.append(hintBtn, back);
  view.append(el('p', 'eyebrow', st.name), el('h2', null, st.person.name + ', ' + st.person.role), el('p', 'say', st.ask), inst.root, feedback, hintBox, foot);
  inst.view = view;
  inst.say = say;
  inst.foot = foot;
  return inst;
}

function onSolved(i) {
  const inst = puzzles[i];
  inst.done = true;
  game.solved[i] = true;
  writeSave();
  setTimeout(() => {
    inst.say(STATIONS[i].success, 'good');
    inst.foot.replaceChildren(button('Light the lantern', 'btn gold', () => {
      closePanel();
      game.mode = 'explore';
      setLantern(world.lanterns[i], true);
      if (i === 2) setMosaicWall(true);
      chime(false);
      refreshActions();
      const left = game.solved.filter((s) => !s).length;
      showPlace('Lantern ' + (i + 1) + ' is lit', left ? left + (left === 1 ? ' lantern' : ' lanterns') + ' still to light' : 'Every lantern is lit');
    }));
    inst.foot.firstChild.focus();
    inst.view.lastChild.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 700);
}

/* =========================================================================
   Moving around, the ending, starting and restarting
   ========================================================================= */
function walkTo(j) {
  game.mode = 'walking';
  refreshActions();
  hidePlace();
  glideTo(poseOf(STATIONS[j]), () => {
    game.at = j;
    game.mode = 'explore';
    writeSave();
    refreshActions();
    showPlace(STATIONS[j].name, STATIONS[j].person.name + ', ' + STATIONS[j].person.role + ', is waiting to talk to you.');
  });
}

function finale() {
  game.mode = 'walking';
  refreshActions();
  glideTo(poseOf(FINALE), () => {
    setLantern(world.great, true);
    if (world.fireflies) world.fireflies.visible = true;
    chime(true);
    game.finished = true;
    writeSave();
    setTimeout(showEnding, 1200);
  });
}

function showEnding() {
  game.mode = 'ending';
  const story = el('div', 'story');
  story.append(
    el('p', 'eyebrow', 'The Palace Garden'),
    el('h2', null, 'The great lantern shines'),
    el('p', null, 'You solved all five puzzles, and every lantern in Isfahan is lit. Hasan, Maryam, Reza, Farhad and Shirin gather in the garden to thank you.'),
    el('p', null, 'This is the end of the first part of the adventure.'),
  );
  const foot = el('div', 'foot');
  foot.append(
    button('Look around', 'btn', () => { closePanel(); game.mode = 'ended'; refreshActions(); }),
    button('Play again', 'btn ghost', () => { closePanel(); resetGame(); startPlaying(); }),
  );
  openPanel([story, foot]);
}

function applyWorldState() {
  world.lanterns.forEach((l, i) => setLantern(l, game.solved[i]));
  setLantern(world.great, game.finished);
  if (world.fireflies) world.fireflies.visible = game.finished;
  setMosaicWall(game.solved[2]);
}

function resetGame() {
  game.at = 0;
  game.solved = [false, false, false, false, false];
  game.finished = false;
  puzzles = [];
  applyWorldState();
  setPose(poseOf(STATIONS[0]));
  writeSave();
}

function showIntro() {
  game.mode = 'intro';
  const story = el('div', 'story');
  const tips = el('ul', 'tips');
  tips.append(
    el('li', null, 'Use the big button at the bottom to talk to people and to walk on.'),
    el('li', null, 'Drag a finger across the picture to look around.'),
    el('li', null, 'Stuck? Every puzzle has hints, and there is no rush.'),
  );
  story.append(
    el('p', 'eyebrow', 'Isfahan, 1150'),
    el('h2', null, 'A dark night in the city'),
    el('p', null, 'The old lamplighter is unwell, and tonight the lanterns of Isfahan are dark. He has trusted five friends across the city with a lantern each.'),
    el('p', null, 'Solve each friend’s puzzle and they will light their lantern. Light all five, and the great lantern of the palace garden will shine again.'),
    tips,
  );
  const go = button('Let’s begin', 'btn gold', () => { closePanel(); startPlaying(); });
  openPanel([story, go]);
  go.focus();
}

function startPlaying() {
  game.mode = game.finished ? 'ended' : 'explore';
  refreshActions();
  const st = STATIONS[game.at];
  if (!game.finished) showPlace(st.name, game.solved[game.at] ? 'Walk on when you are ready.' : st.person.name + ', ' + st.person.role + ', is waiting to talk to you.');
}

function showCover() {
  const box = $('#coverBtns');
  const saved = loadSave();
  const started = saved && (saved.at > 0 || saved.solved.some(Boolean));
  box.replaceChildren();
  if (started) {
    box.append(button('Carry on (' + saved.solved.filter(Boolean).length + ' of 5 lanterns lit)', 'btn gold', () => { $('#cover').hidden = true; chimeUnlock(); startPlaying(); }));
    box.append(button('Start again', 'btn ghost', () => { $('#cover').hidden = true; chimeUnlock(); resetGame(); showIntro(); }));
  } else {
    box.append(button('Begin', 'btn gold', () => { $('#cover').hidden = true; chimeUnlock(); showIntro(); }));
  }
  box.firstChild.focus();
}
// Phones only allow sound after a tap, so wake the audio on the first button press.
function chimeUnlock() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { /* no audio */ }
}

/* Settings: text size and sound */
function applySettings() {
  document.documentElement.classList.toggle('big', game.big);
  $('#textBtn').textContent = game.big ? 'A−' : 'A+';
  $('#soundBtn').textContent = game.sound ? 'Sound on' : 'Sound off';
  $('#soundBtn').setAttribute('aria-pressed', String(game.sound));
}
$('#textBtn').addEventListener('click', () => { game.big = !game.big; applySettings(); writeSave(); });
$('#soundBtn').addEventListener('click', () => { game.sound = !game.sound; applySettings(); writeSave(); if (game.sound) chime(false); });

/* =========================================================================
   Start up and the frame loop
   ========================================================================= */
function resize() {
  if (!has3D) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 72 : 58; // wider view when the phone is upright
  camera.updateProjectionMatrix();
}

let clock = 0, lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  clock += dt;
  if (glide) updateGlide(dt);
  // After a few seconds without dragging, ease the view back to face the person.
  if (!pointer.down && now - look.lastDrag > 5000) {
    const k = Math.exp(-dt * 1.5);
    look.yaw *= k; look.pitch *= k;
  }
  // A gentle drift on the title screen
  const drift = game.mode === 'title' ? Math.sin(clock * 0.25) * 0.12 : 0;
  camera.position.set(view.x, view.y, view.z);
  camera.rotation.set(view.pitch + look.pitch, view.yaw + look.yaw + drift, 0);

  world.people.forEach((p, i) => { p.rotation.z = Math.sin(clock * 1.3 + i) * 0.015; });
  if (world.marker && world.marker.visible) {
    const p = world.people[game.at].position;
    world.marker.position.set(p.x, 2.05 + Math.sin(clock * 2.5) * 0.08, p.z);
    world.marker.rotation.y = clock * 1.8;
  }
  world.lanterns.concat([world.great]).forEach((l, i) => {
    if (l.glow.visible) l.glow.material.opacity = 0.8 + 0.12 * Math.sin(clock * 7 + i * 2) + 0.06 * Math.sin(clock * 13 + i);
  });
  if (world.fireflies && world.fireflies.visible) {
    const pos = world.fireflies.geometry.attributes.position;
    const base = world.fireflyBase;
    for (let i = 0; i < pos.count; i++) {
      pos.setXYZ(i, base[i * 3] + Math.sin(clock * 0.6 + i) * 0.4, base[i * 3 + 1] + Math.sin(clock * 0.9 + i * 1.7) * 0.3, base[i * 3 + 2] + Math.cos(clock * 0.5 + i) * 0.4);
    }
    pos.needsUpdate = true;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

const saved = loadSave();
if (saved) {
  game.at = clamp(saved.at | 0, 0, 4);
  game.solved = saved.solved.map(Boolean);
  game.finished = !!saved.finished;
  game.big = !!saved.big;
  game.sound = saved.sound !== false;
}
applySettings();
updatePips();
if (has3D) {
  try {
    buildWorld();
    applyWorldState();
    setPose(poseOf(STATIONS[game.at]));
    resize();
    addEventListener('resize', resize);
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    has3D = false;
    document.body.classList.add('no3d');
    canvas.hidden = true;
  }
}
showCover();
})();
</script>
